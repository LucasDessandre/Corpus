      secundario: ['Glúteos', 'Ombros'],
      dificuldade: 'iniciante',
      icone: '<img width="25" height="25" src="https://img.icons8.com/ios-filled/50/FFFFFF/prelum.png" alt="prelum"/>',
      videoUrl: 'videos/prancha_isometrica.mp4',
      passos: [
        'Apoie antebraços e pontas dos pés, formando linha reta tornozelo-cabeça.',
        'Abdômen contraído e glúteos levemente ativados.',
        'Respire normalmente e mantenha a posição pelo tempo definido.',
        'Olhar para o chão, pescoço em posição neutra.',
      ],
      alertas: [
        { critico: false, texto: 'Evite deixar o quadril subir ou cair — linha do corpo deve ser reta.' },
        { critico: false, texto: 'Não prenda a respiração durante o exercício.' },
        { critico: false, texto: 'Reduza o tempo se sentir dor lombar — provável postura incorreta.' },
      ],
      dicas: [
        'Contraia o abdômen como se fosse apanhar um soco para maximizar a ativação.',
        'Progrida gradualmente: 30s → 45s → 60s → 90s.',
      ]
    }
  ];

  /* ── STATE ── */
  const state = {
    filtroAtivo: 'todos',
    buscaTerm: '',
    cardExpandido: null,
    videoCarregado: new Set()
  };

  /* ── SELETORES ── */
  const $list      = document.getElementById('exList');
  const $empty     = document.getElementById('emptyState');
  const $countNum  = document.getElementById('countNum');
  const $filterBar = document.getElementById('filterBar');
  const $searchPanel = document.getElementById('searchPanel');
  const $searchInput = document.getElementById('searchInput');
  const $searchToggle = document.getElementById('searchToggle');
  const $searchClear  = document.getElementById('searchClear');
  const $toast     = document.getElementById('toast');

  /* ────────────────────────────────────────
     RENDER ENGINE
  ──────────────────────────────────────── */
  function getFiltrados() {
    const term = state.buscaTerm.toLowerCase().trim();
    return EXERCISES.filter(ex => {
      const matchFiltro = state.filtroAtivo === 'todos' || ex.grupo === state.filtroAtivo;
      const matchBusca  = !term
        || ex.nome.toLowerCase().includes(term)
        || ex.grupoLabel.toLowerCase().includes(term)
        || ex.secundario.some(s => s.toLowerCase().includes(term));
      return matchFiltro && matchBusca;
    });
  }

  function buildCardHTML(ex) {
    const diffClass = {
      iniciante: 'iniciante', intermediario: 'intermediario', avancado: 'avancado'
    }[ex.dificuldade];

    const diffLabel = {
      iniciante: 'Iniciante', intermediario: 'Intermediário', avancado: 'Avançado'
    }[ex.dificuldade];

    const passos = ex.passos.map((p, i) =>
      `<div class="step">
        <div class="step-num">${i + 1}</div>
        <p class="step-text">${p}</p>
      </div>`
    ).join('');

    const alertas = ex.alertas.map(a =>
      `<div class="alert-item ${a.critico ? 'critical' : ''}">
        <span class="alert-emoji">${a.critico ? '🚨' : '⚠️'}</span>
        <p class="alert-text">${a.texto}</p>
      </div>`
    ).join('');

    const dicas = ex.dicas.map(d =>
      `<div class="tip-item">
        <span class="tip-emoji">💡</span>
        <p class="tip-text">${d}</p>
      </div>`
    ).join('');

    const secundarios = ex.secundario.map(s =>
      `<span class="secondary-tag">${s}</span>`
    ).join('');

    return `
      <div class="card-head" onclick="toggleCard('${ex.id}')">
        <div class="muscle-avatar">${ex.icone}</div>
        <div class="card-meta">
          <div class="ex-name">${ex.nome}</div>
          <div class="tag-row">
            <span class="tag tag-muscle">${ex.grupoLabel}</span>
            <span class="tag tag-${diffClass}">${diffLabel}</span>
          </div>
        </div>
        <div class="chevron-wrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </div>
      </div>

      <div class="card-body" id="body-${ex.id}">
        <div class="card-sep"></div>

        <div class="secondary-bar">
          <span class="secondary-label">Secundários:</span>
          <div class="secondary-muscles">${secundarios}</div>
        </div>

        <div class="video-zone">
          <div class="video-ratio">
            <div class="video-thumb" id="thumb-${ex.id}" onclick="carregarVideo('${ex.id}', '${ex.videoUrl}')">
              <div class="play-ring">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </div>
              <span class="video-label">Toque para ver a execução</span>
            </div>
          </div>
        </div>

        <div class="tabs-bar" id="tabs-${ex.id}">
          <button class="tab-btn active" onclick="trocarTab(event,'${ex.id}','steps')">📋 Execução</button>
          <button class="tab-btn"        onclick="trocarTab(event,'${ex.id}','alerts')">⚠️ Alertas</button>
          <button class="tab-btn"        onclick="trocarTab(event,'${ex.id}','tips')">💡 Dicas</button>
        </div>

        <div class="tab-panel active" id="tp-steps-${ex.id}">
          <div class="steps">${passos}</div>
        </div>
        <div class="tab-panel" id="tp-alerts-${ex.id}">
          <div class="alerts">${alertas}</div>
        </div>
        <div class="tab-panel" id="tp-tips-${ex.id}">
          <div class="tips">${dicas}</div>
        </div>

        <button class="add-btn" onclick="adicionarAoTreino('${ex.id}', '${ex.nome.replace(/'/g,"\\'")}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Adicionar ao Meu Treino
        </button>
      </div>
    `;
  }

  function renderLista() {
    const filtrados = getFiltrados();

    $list.innerHTML = '';
    $countNum.textContent = filtrados.length;

    if (filtrados.length === 0) {
      $empty.classList.add('show');
      return;
    }

    $empty.classList.remove('show');
    filtrados.forEach((ex, i) => {
      const card = document.createElement('div');
      card.className = 'exercise-card';
      card.dataset.id = ex.id;
      card.style.animationDelay = `${i * 0.055}s`;
      card.innerHTML = buildCardHTML(ex);
      $list.appendChild(card);
    });
  }

  /* ────────────────────────────────────────
     FILTRO POR GRUPO MUSCULAR
  ──────────────────────────────────────── */
  // Transforma o scroll vertical da rodinha do mouse em scroll horizontal
  $filterBar.addEventListener('wheel', (e) => {
    // Se a rodinha foi movida para cima/baixo
    if (e.deltaY !== 0) {
      e.preventDefault(); // Evita que a página inteira role junto
      $filterBar.scrollLeft += e.deltaY;
    }
  });

  // Evento de clique no filtro (agora limpo e direto ao ponto)
  $filterBar.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;

    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filtroAtivo = chip.dataset.filter;
    state.cardExpandido = null;
    renderLista();
  });
  /* ────────────────────────────────────────
     BUSCA EM TEMPO REAL
  ──────────────────────────────────────── */
  $searchToggle.addEventListener('click', () => {
    const aberta = $searchPanel.classList.contains('open');
    $searchPanel.classList.toggle('open');
    $searchToggle.classList.toggle('active');

    if (!aberta) {
      requestAnimationFrame(() => $searchInput.focus());
    } else {
      // Fecha e limpa
      state.buscaTerm = '';
      $searchInput.value = '';
      renderLista();
    }
  });

  $searchInput.addEventListener('input', e => {
    state.buscaTerm = e.target.value;
    state.cardExpandido = null;
    renderLista();
  });

  $searchClear.addEventListener('click', () => {
    state.buscaTerm = '';
    $searchInput.value = '';
    $searchInput.focus();
    renderLista();
  });

  /* ────────────────────────────────────────
     ACCORDION — ABRIR/FECHAR CARD
  ──────────────────────────────────────── */
  function toggleCard(id) {
    const cardAlvo = document.querySelector(`[data-id="${id}"]`);
    if (!cardAlvo) return;

    const estaExpandido = cardAlvo.classList.contains('expanded');

    // Fecha todos
    document.querySelectorAll('.exercise-card.expanded').forEach(c => {
      c.classList.remove('expanded');
    });

    if (!estaExpandido) {
      cardAlvo.classList.add('expanded');
      state.cardExpandido = id;
      // Scroll suave para não perder o contexto
      setTimeout(() => {
        const top = cardAlvo.getBoundingClientRect().top + window.scrollY;
        const headerH = document.querySelector('.app-header').offsetHeight;
        window.scrollTo({ top: top - headerH - 12, behavior: 'smooth' });
      }, 60);
    } else {
      state.cardExpandido = null;
    }
  }

  /* ────────────────────────────────────────
     CARREGAR VÍDEO NATIVO (HTML5)
     Com controles de Pause/Play e Áudio
  ──────────────────────────────────────── */
  function carregarVideo(cardId, videoUrl) {
    if (state.videoCarregado.has(cardId)) return;
    const thumb = document.getElementById(`thumb-${cardId}`);
    if (!thumb) return;

    state.videoCarregado.add(cardId);

    // Fade out do placeholder
    thumb.style.transition = 'opacity 0.25s';
    thumb.style.opacity = '0';

    setTimeout(() => {
      const wrapper = thumb.parentElement;
      thumb.remove();

      const video = document.createElement('video');
      video.src = videoUrl;
      video.autoplay = true; 
      
      // Ativamos os controles (Pause, Play, Som, Tela cheia)
      video.controls = true; 
      
      // Permitimos que o vídeo não abra em tela cheia automático no iPhone
      video.playsInline = true; 
      
      // Opcional: Se algum navegador bloquear o autoplay com som, o player 
      // vai apenas carregar e esperar o usuário apertar o "Play" manualmente.

      // Estilos para o vídeo preencher o espaço certinho
      video.style.position = 'absolute';
      video.style.inset = '0';
      video.style.width = '100%';
      video.style.height = '100%';
      // O objectFit 'contain' garante que os controles não fiquem cortados
      video.style.objectFit = 'contain'; 
      video.style.backgroundColor = '#000'; // Fundo preto para as bordas do vídeo
      video.style.borderRadius = 'var(--radius)';

      wrapper.appendChild(video);
    }, 250);
  }

  /* ────────────────────────────────────────
     TROCA DE ABAS (Execução / Alertas / Dicas)
  ──────────────────────────────────────── */
  function trocarTab(event, cardId, aba) {
    // Evita propagação para o card-head
    event.stopPropagation();
    const tabsBar = document.getElementById(`tabs-${cardId}`);
    if (!tabsBar) return;

    // Botões
    tabsBar.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    // Painéis
    const card = document.querySelector(`[data-id="${cardId}"]`);
    card.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

    const painel = document.getElementById(`tp-${aba}-${cardId}`);
    if (painel) painel.classList.add('active');
  }

  /* ────────────────────────────────────────
     ADICIONAR AO TREINO
     (aqui você conectará ao módulo RF8)
  ──────────────────────────────────────── */
  function adicionarAoTreino(id, nome) {
    // TODO: integrar com módulo de montagem de treino (RF8)
    // Salvar em localStorage ou enviar para API
    const treino = JSON.parse(localStorage.getItem('ff_treino') || '[]');
    const jaExiste = treino.some(e => e.id === id);

    if (jaExiste) {
      showToast(`"${nome}" já está no treino!`);
    } else {
      treino.push({ id, nome, series: 3, reps: 12, cargaAnterior: 0 });
      localStorage.setItem('ff_treino', JSON.stringify(treino));
      showToast(`${nome} adicionado! 💪`);
    }
  }

  /* ────────────────────────────────────────
     TOAST NOTIFICATION
  ──────────────────────────────────────── */
  let toastTimer = null;
  function showToast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');

    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 2600);
  }

  /* ────────────────────────────────────────
     CONTADORES DE CHIPS
  ──────────────────────────────────────── */
  function atualizarContadores() {
    const grupos = ['peito','costas','pernas','ombros','bracos','core'];
    grupos.forEach(g => {
      const el = document.getElementById(`cnt-${g}`);
      if (el) el.textContent = EXERCISES.filter(e => e.grupo === g).length;
    });
    const elTodos = document.getElementById('cnt-todos');
    if (elTodos) elTodos.textContent = EXERCISES.length;
  }

  /* ────────────────────────────────────────
     INICIALIZAÇÃO
  ──────────────────────────────────────── */
  atualizarContadores();
  renderLista();

  // Expôe funções globais necessárias para os event handlers inline
  window.toggleCard   = toggleCard;
  window.carregarVideo = carregarVideo;
  window.trocarTab    = trocarTab;
  window.adicionarAoTreino = adicionarAoTreino;

  </script>
</body>
</html>
