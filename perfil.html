<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CORPUS — Meu Perfil</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <style>
    main { padding-bottom: 100px; }

    /* ── CABEÇALHO DO PERFIL ── */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 20px;
      gap: 12px;
    }

    .avatar-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .profile-info {
      text-align: center;
    }

    .profile-name {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 4px;
    }

    .profile-email {
      font-size: 13px;
      color: var(--text-3);
      font-weight: 500;
    }

    .badge-nivel {
      display: inline-block;
      margin-top: 8px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-glow);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── MÉTRICAS RÁPIDAS ── */
    .metrics-row {
      display: flex;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .metric-box {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mb-val {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-1);
    }

    .mb-lbl {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── MENU DE OPÇÕES ── */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 20px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .menu-item:active {
      background: var(--bg-elevated);
      scale: 0.98;
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
    }

    .menu-icon {
      color: var(--accent);
    }

    .menu-chevron {
      color: var(--text-3);
    }

    .menu-item.danger .menu-item-left {
      color: var(--danger);
    }
    .menu-item.danger .menu-icon {
      color: var(--danger);
    }

  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-main">
      <div class="brand">
        <span class="brand-text">CO<span class="accent">RPUS</span></span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" aria-label="Configurações" title="Configurações">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="page-meta">
      <span class="page-title">Meu Perfil</span>
    </div>
  </header>

  <main>
    
    <div class="profile-header">
      <div class="avatar-circle">US</div>
      <div class="profile-info">
        <div class="profile-name">Usuário Teste</div>
        <div class="profile-email">usuario@corpusapp.com</div>
        <div class="badge-nivel">Intermediário</div>
      </div>
    </div>

    <div class="metrics-row">
      <div class="metric-box">
        <div class="mb-val" id="pesoDisplay">80 kg</div>
        <div class="mb-lbl">Peso Atual</div>
      </div>
      <div class="metric-box">
        <div class="mb-val">181 cm</div>
        <div class="mb-lbl">Altura</div>
      </div>
    </div>

    <div class="menu-list">
      <div class="menu-item" onclick="showToast('Em desenvolvimento')">
        <div class="menu-item-left">
          <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Editar Dados Pessoais
        </div>
        <svg class="menu-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
      </div>

      <div class="menu-item" onclick="showToast('Em desenvolvimento')">
        <div class="menu-item-left">
          <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          Histórico de Lesões (RF9)
        </div>
        <svg class="menu-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
      </div>

      <div class="menu-item" onclick="showToast('Em desenvolvimento')">
        <div class="menu-item-left">
          <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          Ajuda e Suporte
        </div>
        <svg class="menu-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
      </div>

      <div class="menu-item danger" id="btnLogout">
        <div class="menu-item-left">
          <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Sair da Conta
        </div>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <div class="nav-btn" id="nav-inicio">
      <span class="nav-ico">🏠</span>
      <span class="nav-lbl">Início</span>
    </div>
    <div class="nav-btn" id="nav-biblioteca">
      <span class="nav-ico">📚</span>
      <span class="nav-lbl">Biblioteca</span>
    </div>
    <div class="nav-btn" id="nav-treino">
      <span class="nav-ico">🗓️</span>
      <span class="nav-lbl">Meu Treino</span>
    </div>
    <div class="nav-btn" id="nav-evolucao">
      <span class="nav-ico">📊</span>
      <span class="nav-lbl">Evolução</span>
    </div>
    <div class="nav-btn active" id="nav-perfil">
      <span class="nav-ico">👤</span>
      <span class="nav-lbl">Perfil</span>
    </div>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    /* ────────────────────────────────────────
       CARREGAR DADOS DO LOCALSTORAGE
    ──────────────────────────────────────── */
    // Puxa o peso salvo na tela de "Meu Treino"
    const pesoSalvo = localStorage.getItem('ff_peso_kg');
    if (pesoSalvo) {
      document.getElementById('pesoDisplay').textContent = `${pesoSalvo} kg`;
    }

    /* ────────────────────────────────────────
       BOTÃO DE LOGOUT
    ──────────────────────────────────────── */
    document.getElementById('btnLogout').addEventListener('click', () => {
      // Como ainda não temos a tela de login real, apenas mostramos um aviso
      showToast('Saindo da conta...');
      // Em uma versão final, aqui faríamos: window.location.href = 'login.html';
    });

    /* ────────────────────────────────────────
       NAVEGAÇÃO ENTRE TELAS
    ──────────────────────────────────────── */
 function irPara(url) { 
  window.location.href = url; 
}

// Configuração dos listeners de clique na bottom-nav
document.getElementById('nav-inicio').addEventListener('click',     () => irPara('dashboard.html'));
document.getElementById('nav-biblioteca').addEventListener('click', () => irPara('index.html'));
document.getElementById('nav-treino').addEventListener('click',     () => irPara('treino.html'));
document.getElementById('nav-evolucao').addEventListener('click',   () => irPara('evolucao.html'));
document.getElementById('nav-perfil').addEventListener('click',     () => irPara('perfil.html'));

    /* ────────────────────────────────────────
       TOAST UTILS
    ──────────────────────────────────────── */
    let toastTimer;
    function showToast(msg) {
      const $toast = document.getElementById('toast');
      $toast.textContent = msg;
      $toast.classList.add('show');
      if(toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $toast.classList.remove('show'), 2600);
    }
  </script>
</body>
</html>
