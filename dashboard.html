<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CORPUS — Início</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="corpus.css">

  <style>
    .dash-wrap {
      padding: 24px 20px 100px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ─── BOAS-VINDAS ─── */
    .greeting-line {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .welcome-name {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: 0.02em;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .welcome-name .accent { color: var(--accent); }

    .level-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-med);
      border-radius: 100px;
      padding: 5px 13px;
      margin-bottom: 16px;
    }

    .level-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .level-pill span {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ok);
    }

    .frase-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .frase-text {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .frase-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
      line-height: 1.5;
    }

    /* ─── TREINO DE HOJE ─── */
    .today-card {
      background: var(--bg-card);
      border: 1px solid var(--border-med);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
    }

    .today-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .today-inner { padding: 18px 18px 16px; }

    .today-live-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(96,200,245,0.08);
      border: 1px solid rgba(96,200,245,0.2);
      border-radius: 4px;
      padding: 3px 9px;
      margin-bottom: 14px;
    }

    .today-live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.6s ease-in-out infinite;
    }

    .today-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 4px;
    }

    .today-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      margin-bottom: 16px;
    }

    .today-subtitle strong { color: var(--text-2); }

    .prog-wrap { margin-bottom: 16px; }

    .prog-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      margin-bottom: 6px;
    }

    .prog-labels em { font-style: normal; color: var(--accent); }

    .prog-track {
      height: 3px;
      background: var(--bg-elevated);
      border-radius: 99px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    }

    .today-ex-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
    }

    .today-ex-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: border-color 0.2s;
    }

    .today-ex-row.done-row { border-color: rgba(61,221,140,0.2); }

    .today-ex-ico {
      width: 34px; height: 34px;
      border-radius: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .today-ex-info { flex: 1; min-width: 0; }

    .today-ex-name {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .today-ex-detail {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
      margin-top: 2px;
    }

    .check-btn {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--border-med);
      background: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .check-btn:active { scale: 0.88; }
    .check-btn.done { background: var(--ok); border-color: var(--ok); }
    .check-btn svg { display: none; width: 12px; height: 12px; stroke: #060f09; fill: none; stroke-width: 3; }
    .check-btn.done svg { display: block; }

    .today-more {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      text-align: center;
      margin-bottom: 14px;
    }

    .today-empty { text-align: center; padding: 16px 0 14px; }
    .today-empty-ico { font-size: 38px; opacity: 0.3; margin-bottom: 10px; }
    .today-empty-txt {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-3);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    /* botões — mesmo padrão do add-btn */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #060801;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:active { scale: 0.97; filter: brightness(0.92); }
    .btn-primary svg { width: 15px; height: 15px; flex-shrink: 0; }

    .btn-ghost {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border-med);
      border-radius: var(--radius);
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .btn-ghost:active { scale: 0.97; }
    .btn-ghost svg { width: 14px; height: 14px; stroke: var(--text-2); fill: none; stroke-width: 2; flex-shrink: 0; }

    /* ─── MÉTRICAS ─── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
      overflow: hidden;
    }

    .metric-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
    }

    .metric-card.m-blue::after   { background: var(--accent); }
    .metric-card.m-green::after  { background: var(--ok); }
    .metric-card.m-orange::after { background: var(--warn); }

    .metric-ico  { font-size: 19px; line-height: 1; margin-bottom: 2px; }

    .metric-val {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }

    .metric-val small { font-size: 13px; font-weight: 600; }

    .metric-card.m-blue  .metric-val { color: var(--accent); }
    .metric-card.m-green .metric-val { color: var(--ok); }
    .metric-card.m-orange .metric-val { color: var(--warn); }

    .metric-lbl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      line-height: 1.3;
    }

    .metric-delta {
      font-size: 10px;
      font-weight: 600;
      color: var(--ok);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <a class="skip" href="#conteudo">Pular para o conteúdo</a>

  <section class="page-hero">
    <div class="wrap">
      <nav class="crumb" aria-label="Data de hoje">
        <span id="pageDate">—</span>
      </nav>

      <p class="kicker" id="greeting"></p>

      <h1>Olá, <em id="userName">Atleta</em></h1>

      <div class="level-pill">
        <div class="level-dot"></div>
        <span id="userLevel">Iniciante</span>
      </div>

      <div class="frase-card">
        <p class="frase-text" id="fraseText"></p>
        <p class="frase-sub"  id="fraseSub"></p>
      </div>
    </div>
  </section>

  <main class="page-body dash-wrap" id="conteudo">

    <div class="cols-side">

    <section>
      <span class="section-label">Treino de hoje</span>
      <div class="today-card">
        <div class="today-inner" id="todayInner"></div>
      </div>
    </section>

    <section>
      <span class="section-label">Resumo da semana</span>
      <div class="metrics-grid">
        <div class="metric-card m-blue">
          <div class="metric-ico">🗓️</div>
          <div class="metric-val" id="mTreinos">—</div>
          <div class="metric-lbl">Treinos realizados</div>
          <div class="metric-delta" id="mTreinosDelta"></div>
        </div>
        <div class="metric-card m-green">
          <div class="metric-ico">🏋️</div>
          <div class="metric-val" id="mCarga">—</div>
          <div class="metric-lbl">Carga total</div>
          <div class="metric-delta" id="mCargaDelta"></div>
        </div>
        <div class="metric-card m-orange">
          <div class="metric-ico">🔥</div>
          <div class="metric-val" id="mStreak">—</div>
          <div class="metric-lbl">Dias seguidos</div>
          <div class="metric-delta" id="mStreakDelta"></div>
        </div>
      </div>
    </section>

    </div>

  </main>


<div class="toast" id="toast"></div>

  <script src="corpus.js"></script>

  <script>
  const USER    = JSON.parse(localStorage.getItem('corpus_user')     || 'null') || { nome: 'Atleta', nivel: 'Iniciante' };
  const TREINO  = JSON.parse(localStorage.getItem('ff_treino')       || '[]');
  const METRICAS = JSON.parse(localStorage.getItem('corpus_metricas') || 'null') || {
    treinos: 3, cargaTotal: 25.5, streak: 4,
    treinosDelta: '+1 vs sem. passada',
    cargaDelta:   '+10kg',
    streakDelta:  'Recorde pessoal! 🎉',
  };

  const FRASES = [
    { texto: '"A técnica é o que separa o treino do progresso."',   sub: 'Cada repetição perfeita conta.' },
    { texto: '"Consistência supera intensidade."',                   sub: 'Aparecer todo dia é o maior trunfo de um atleta.' },
    { texto: '"Dor de crescimento, não dor de lesão."',             sub: 'Aprenda a diferença — seu corpo agradece.' },
    { texto: '"Progrida um quilo de cada vez."',                    sub: 'Pequenos aumentos constroem grandes físicos.' },
    { texto: '"O alongamento de hoje é a lesão que não acontece."', sub: 'Reserve 5 min no final. Seu eu futuro agradece.' },
    { texto: '"Sem técnica, carga é só risco."',                    sub: 'Domine o movimento antes de adicionar peso.' },
    { texto: '"Descanso também é treino."',                         sub: 'Músculo cresce na recuperação, não na academia.' },
  ];

  const GRUPO_ICO = { peito:'🫀', costas:'🔙', pernas:'🦵', ombros:'💪', bracos:'💪', core:'🎯' };

  function getGreeting() {
    const h = new Date().getHours();
    if (h < 12) return 'Bom dia';
    if (h < 18) return 'Boa tarde';
    return 'Boa noite';
  }

  function getDateLabel() {
    return new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  }

  function fmtCarga(n) {
    return n >= 1000 ? `${(n/1000).toFixed(1)}<small>k kg</small>` : `${n}<small>kg</small>`;
  }

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function renderWelcome() {
    document.getElementById('pageDate').textContent  = getDateLabel();
    document.getElementById('greeting').textContent  = getGreeting();
    document.getElementById('userName').textContent  = USER.nome;
    document.getElementById('userLevel').textContent = USER.nivel;
    const f = FRASES[new Date().getDate() % FRASES.length];
    document.getElementById('fraseText').textContent = f.texto;
    document.getElementById('fraseSub').textContent  = f.sub;
  }

  function renderToday() {
    const el = document.getElementById('todayInner');
    const concluidos = JSON.parse(localStorage.getItem('corpus_concluidos') || '[]');
    const total = TREINO.length;
    const done  = concluidos.length;
    const pct   = total > 0 ? Math.round((done / total) * 100) : 0;

    if (total === 0) {
      el.innerHTML = `
        <div class="today-live-tag"><div class="today-live-dot"></div> Hoje</div>
        <div class="today-empty">
          <div class="today-empty-ico">🗓️</div>
          <p class="today-empty-txt">Nenhum treino montado para hoje.<br>Adicione exercícios na Biblioteca.</p>
          <button class="btn-primary" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Ir para a Biblioteca
          </button>
        </div>`;
      return;
    }

    const rows = TREINO.slice(0, 3).map(ex => {
      const isDone = concluidos.includes(ex.id);
      return `
        <div class="today-ex-row ${isDone ? 'done-row' : ''}">
          <div class="today-ex-ico">${GRUPO_ICO[ex.grupo] || '🏋️'}</div>
          <div class="today-ex-info">
            <div class="today-ex-name">${ex.nome}</div>
            <div class="today-ex-detail">${ex.series || 3} séries · ${ex.reps || 12} reps</div>
          </div>
          <button class="check-btn ${isDone ? 'done' : ''}" onclick="toggleDone('${ex.id}')" aria-label="Concluído">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>`;
    }).join('');

    const extras = total > 3 ? `<p class="today-more">+ ${total - 3} exercício(s) no treino</p>` : '';

    el.innerHTML = `
      <div class="today-live-tag"><div class="today-live-dot"></div> Hoje</div>
      <div class="today-title">Treino do Dia</div>
      <p class="today-subtitle"><strong>${total}</strong> exercícios · ~${total * 8} min estimados</p>
      <div class="prog-wrap">
        <div class="prog-labels">Progresso <em>${done}/${total} concluídos</em></div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="today-ex-list">${rows}</div>
      ${extras}
      <button class="btn-primary" onclick="showToast('Iniciando treino... 💪')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Iniciar Treino
      </button>
      <button class="btn-ghost" onclick="window.location.href='index.html'">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Adicionar exercícios
      </button>`;
  }

  function toggleDone(id) {
    const concluidos = JSON.parse(localStorage.getItem('corpus_concluidos') || '[]');
    const idx = concluidos.indexOf(id);
    if (idx === -1) { concluidos.push(id); showToast('Exercício concluído! ✅'); }
    else            { concluidos.splice(idx, 1); }
    localStorage.setItem('corpus_concluidos', JSON.stringify(concluidos));
    renderToday();
  }

  function renderMetrics() {
    document.getElementById('mTreinos').textContent     = METRICAS.treinos;
    document.getElementById('mCarga').innerHTML         = fmtCarga(METRICAS.cargaTotal);
    document.getElementById('mStreak').textContent      = METRICAS.streak;
    document.getElementById('mTreinosDelta').textContent = METRICAS.treinosDelta;
    document.getElementById('mCargaDelta').textContent   = METRICAS.cargaDelta;
    document.getElementById('mStreakDelta').textContent  = METRICAS.streakDelta;
  }

  

  function irPara(url) { 
  window.location.href = url; 
 }


  window.toggleDone = toggleDone;
  renderWelcome();
  renderToday();
  renderMetrics();
  </script>
</body>
</html>
